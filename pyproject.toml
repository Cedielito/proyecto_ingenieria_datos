[build-system]
requires = ["setuptools>=68", "wheel"]


[project]
name = "proyecto_ingenieria_datos"
version = "0.1.0"
description = "Pipeline ETL modular para análisis de ventas"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "typer>=0.9",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "jupyterlab>=4.0",
    "ipython>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
